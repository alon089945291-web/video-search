  <title>חיפוש סרטונים</title>
  <style>
:root {
  --bg: #0d0f14;
  --panel: #161a22;
  --panel-2: #1d2230;
  --line: #2a3142;
  --text: #e9ecf3;
  --muted: #8f98ab;
  --accent: #6c8cff;
  --accent-2: #36d6c3;
  --grad: linear-gradient(135deg, var(--accent), var(--accent-2));
  --radius: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(1200px 600px at 100% -10%, #1b2340 0%, transparent 60%), var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "Heebo", "Assistant", Arial, sans-serif;
  font-size: 15px;
}
button { font-family: inherit; cursor: pointer; }

/* ---- סרגל עליון ---- */
.top {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 24px;
  padding: 16px 28px;
  background: rgba(13, 15, 20, .82);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; white-space: nowrap; }
.brand img { width: 32px; height: 32px; }
.search {
  flex: 1; display: flex; align-items: center; gap: 8px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 6px 6px 6px; max-width: 760px;
  transition: border-color .2s, box-shadow .2s;
}
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(108,140,255,.15); }
.search-ico { width: 20px; height: 20px; fill: var(--muted); margin-inline-start: 10px; flex: none; }
.search input {
  flex: 1; background: none; border: 0; outline: 0; color: var(--text);
  font-size: 16px; padding: 8px 4px; font-family: inherit;
}
.icon-btn { background: none; border: 0; color: var(--muted); font-size: 14px; padding: 6px 10px; border-radius: 50%; }
.icon-btn:hover { color: var(--text); background: var(--panel-2); }
.primary {
  background: var(--grad); color: #0b0e16; border: 0; font-weight: 700;
  padding: 10px 22px; border-radius: 999px; font-size: 15px;
  transition: transform .15s, filter .15s;
}
.primary:hover { filter: brightness(1.08); }
.primary:active { transform: scale(.97); }
.secondary {
  background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
  border-radius: 999px; font-weight: 700; transition: .15s;
}
.secondary:hover { border-color: var(--accent); }
.secondary:disabled { opacity: .75; cursor: wait; }
.secondary.big { width: 100%; padding: 13px; font-size: 15px; }
.primary.big { width: 100%; padding: 14px; font-size: 16px; }

/* ---- חיפושים אחרונים ---- */
.recent { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 28px 0; }
.chip {
  background: var(--panel); border: 1px solid var(--line); color: var(--muted);
  padding: 6px 14px; border-radius: 999px; font-size: 13px;
}
.chip:hover { color: var(--text); border-color: var(--accent); }

/* ---- תוצאות ---- */
main { padding: 20px 28px 40px; }
.status { color: var(--muted); text-align: center; }
.status.big { padding: 90px 20px; font-size: 17px; }
.status .emoji { font-size: 46px; display: block; margin-bottom: 12px; }
.status button { margin-top: 16px; }
.grid {
  display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
}
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden; display: flex; flex-direction: column;
  transition: transform .2s, box-shadow .2s, border-color .2s;
  animation: rise .35s ease both;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,.45); border-color: #3a4560; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.thumb {
  position: relative; aspect-ratio: 9 / 14; background: #0a0c10; cursor: pointer; overflow: hidden;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
.card:hover .thumb img { transform: scale(1.04); }
.thumb::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.75), transparent 45%);
}
.play {
  position: absolute; inset: 0; margin: auto; width: 58px; height: 58px; z-index: 2;
  border-radius: 50%; background: rgba(255,255,255,.18); backdrop-filter: blur(6px);
  display: grid; place-items: center; opacity: 0; transform: scale(.85); transition: .2s;
}
.play::before { content: ""; border-style: solid; border-width: 11px 0 11px 18px; border-color: transparent transparent transparent #fff; margin-left: 4px; }
.thumb:hover .play { opacity: 1; transform: scale(1); }
.dur, .views {
  position: absolute; bottom: 10px; z-index: 2; font-size: 12px; font-weight: 600;
  background: rgba(0,0,0,.55); padding: 3px 8px; border-radius: 6px;
}
.dur { left: 10px; direction: ltr; }
.views { right: 10px; }
.body { padding: 12px 12px 8px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.title {
  margin: 0; font-size: 14px; line-height: 1.45; color: var(--text);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em;
}
.by { color: var(--muted); font-size: 12.5px; direction: ltr; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.actions { display: flex; gap: 8px; padding: 0 12px 12px; }
.actions button {
  flex: 1; background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 4px; font-size: 13px; white-space: nowrap; transition: .15s;
}
.actions button:hover { border-color: var(--accent); background: #232a3c; }
.actions button:disabled { opacity: .7; cursor: wait; }
.actions .copy.done { background: var(--grad); color: #0b0e16; border-color: transparent; }

/* שלד טעינה */
.skeleton .thumb, .skeleton .sk {
  background: linear-gradient(90deg, #171b24 25%, #20263336 37%, #171b24 63%);
  background-size: 400% 100%; animation: shimmer 1.3s infinite;
}
.skeleton .thumb::after { display: none; }
.sk { height: 12px; border-radius: 6px; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

.more { display: flex; justify-content: center; align-items: center; gap: 10px; color: var(--muted); padding: 24px; }
.more[hidden] { display: none; }
#sentinel { height: 1px; }
.spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- חלון תצוגה ---- */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; }
.modal[hidden] { display: none; }
.backdrop { position: absolute; inset: 0; background: rgba(5,6,10,.82); backdrop-filter: blur(8px); animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  position: relative; display: flex; gap: 0; max-height: 92vh; max-width: 94vw;
  background: var(--panel); border: 1px solid var(--line); border-radius: 22px; overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: pop .25s ease;
}

// ---------- GitHub ----------
async function gh(path, opts = {}) {
  const res = await fetch(GH + path, {
    ...opts,
    headers: {
      Authorization: `Bearer ${cfg.token}`,
      Accept: "application/vnd.github+json",
      ...(opts.body ? { "Content-Type": "application/json" } : {})
    }
  });
  if (res.status === 401) throw new Error("מפתח הגישה (Token) לא תקין או שפג תוקפו");
  if (res.status === 403) throw new Error("למפתח אין הרשאה מספיקה – צריך Actions: Read and write");
  if (res.status === 404) throw new Error("הריפו או קובץ ה־workflow לא נמצאו – בדוק את השם ואת הקובץ .github/workflows/web.yml");
  if (!res.ok) throw Object.assign(new Error(`שגיאה ${res.status} בזמן ${path.includes("/zip") ? "הורדת התוצאה מ־GitHub" : "פנייה ל־GitHub"}`), { status: res.status });
  return res;
}
const repoPath = () => `/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`;

async function checkConnection() {
  const repo = await (await gh(repoPath())).json();
  cfg.branch = repo.default_branch;
  await gh(`${repoPath()}/actions/workflows/${WORKFLOW}`);
  return repo;
}

// מפעיל תהליך בשרת של GitHub ומחזיר את קובץ התוצאה (ZIP) כבייטים
async function runJob(inputs, onStep) {
  if (!cfg.branch) await checkConnection();
  const request_id = `${inputs.mode}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
  const started = Date.now();
  const dispatch = (inp) => gh(`${repoPath()}/actions/workflows/${WORKFLOW}/dispatches`, {
    method: "POST",
    body: JSON.stringify({ ref: cfg.branch, inputs: { ...inp, request_id } })
  });
  try {
    await dispatch(inputs);
  } catch (e) {
    // קובץ workflow ישן שלא מכיר את השדות החדשים – שולחים בלעדיהם
    if (e.status !== 422 || !("page_size" in inputs || "names" in inputs || "expand" in inputs)) throw e;
    const { page_size, names, expand, ...rest } = inputs;
    await dispatch(rest);
  }
  onStep("השרת של GitHub מתחיל לעבוד…", "start");

  // מחפשים את הריצה שלנו לפי השם הייחודי
  let run = null;
  while (!run) {
    if (Date.now() - started > 120000) throw new Error("GitHub לא התחיל את התהליך – נסה שוב");
    await sleep(2000);
    const list = await (await gh(`${repoPath()}/actions/runs?event=workflow_dispatch&per_page=30`)).json();
    run = (list.workflow_runs || []).find((r) => r.display_title === request_id || r.name === request_id);
  }

  // ממתינים לסיום
  while (run.status !== "completed") {
    if (Date.now() - started > 15 * 60000) throw new Error("התהליך לקח יותר מדי זמן");
    onStep(run.status === "in_progress" ? (inputs.mode === "search" ? "מחפש…" : "מוריד את הסרטון בשרת…") : "ממתין בתור…",
      run.status === "in_progress" ? "running" : "queued");
    await sleep(2000);
    run = await (await gh(`${repoPath()}/actions/runs/${run.id}`)).json();
  }
  if (run.conclusion !== "success") {
    const err = new Error(inputs.mode === "search" ? "החיפוש נכשל בשרת" : "ההורדה נכשלה בשרת");
    err.url = run.html_url;
    throw err;
  }

  onStep("מושך את התוצאה…", "fetch");
  return { run, request_id, art: null };
}

async function fetchArtifact(art, onProgress) {
  const res = await gh(`${repoPath()}/actions/artifacts/${art.id}/zip`);
  const total = +res.headers.get("content-length") || art.size_in_bytes || 0;
  const reader = res.body.getReader();
  const chunks = []; let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    onProgress?.(total ? Math.min(100, Math.round((got / total) * 100)) : null, got);
  }
  const out = new Uint8Array(got); let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return out;
}

// קריאת קובץ מתוך ZIP (לתוצאות החיפוש)
async function readFromZip(bytes, wanted) {
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 66000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("קובץ התוצאה פגום");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  for (let n = 0; n < count; n++) {
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const loff = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nlen));
    if (name.endsWith(wanted)) {
      const start = loff + 30 + dv.getUint16(loff + 26, true) + dv.getUint16(loff + 28, true);
      const raw = bytes.subarray(start, start + csize);
      if (method === 0) return raw;
      if (method === 8) {
        const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
        return new Uint8Array(await new Response(stream).arrayBuffer());
      }
      throw new Error("שיטת דחיסה לא נתמכת");
    }
    p += 46 + nlen + elen + clen;
  }
  throw new Error("לא נמצא קובץ תוצאה");
}


function browserDownload(url, filename, onPct) {
  return new Promise((resolve, reject) => {
    chrome.downloads.download({
      url, filename, conflictAction: "uniquify",
      headers: [{ name: "Authorization", value: `Bearer ${cfg.token}` }]
    }, (id) => {
      if (chrome.runtime.lastError || id == null) return reject(new Error(chrome.runtime.lastError?.message || "download failed"));
      const onChange = (d) => {
        if (d.id !== id || !d.state) return;
        if (d.state.current === "complete") { chrome.downloads.onChanged.removeListener(onChange); resolve(); }
        if (d.state.current === "interrupted") { chrome.downloads.onChanged.removeListener(onChange); reject(new Error("interrupted")); }
      };
      chrome.downloads.onChanged.addListener(onChange);
      const poll = setInterval(() => {
        chrome.downloads.search({ id }, ([d] = []) => {
          if (!d || d.state !== "in_progress") { clearInterval(poll); return; }
          if (d.totalBytes > 0) onPct?.(Math.round((d.bytesReceived / d.totalBytes) * 100));
        });
      }, 400);
    });
  });
}


const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(b) { let c = 0xffffffff; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }

// בונה ZIP (ללא דחיסה) מכמה קבצים
// בונה ZIP פשוט (בלי דחיסה, בלי "data descriptor") – הפורמט ש־Windows מחלץ בלי בעיה
function buildZip(files) {
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = f.data, crc = crc32(data);
    const unicode = /[^\x20-\x7e]/.test(f.name);
    const flags = unicode ? 0x0800 : 0; // UTF-8 בשמות (עברית)
    // שדה נוסף 0x7075 (Unicode Path) – לתוכנות חילוץ ישנות
    let extra = new Uint8Array(0);
    if (unicode) {
      extra = new Uint8Array(9 + name.length);
      const x = new DataView(extra.buffer);
      x.setUint16(0, 0x7075, true); x.setUint16(2, 5 + name.length, true); x.setUint8(4, 1);
      x.setUint32(5, crc32(name), true); extra.set(name, 9);
    }
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 10, true); h.setUint16(6, flags, true); h.setUint16(8, 0, true);
    h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
    h.setUint16(26, name.length, true); h.setUint16(28, extra.length, true);
    parts.push(h, name, extra, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 10, true); c.setUint16(8, flags, true);
    c.setUint16(10, 0, true); c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, name.length, true); c.setUint16(30, extra.length, true); c.setUint32(38, 0x20, true); c.setUint32(42, offset, true);
    central.push(c, name, extra);
    offset += 30 + name.length + extra.length + data.length;
  }
  const csize = central.reduce((n, p) => n + p.byteLength, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, csize, true); e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, e], { type: "application/zip" });
}

// ---------- שם קובץ בטוח לפי כותרת הסרטון ----------
function safeName(v, max = 70) {
  let t = String(v?.title || "")
    .replace(/#[^\s#]+/g, " ")                              // האשטגים
    .replace(/@[\w.\-]+/g, " ")                               // תיוגים
    .replace(/[\u0000-\u001f\u007f<>:"\/\\|?*]/g, " ")        // אסור ב־Windows
    .replace(/[​-‏‪-‮⁠-⁩﻿]/g, "") // סימני כיוון נסתרים
    .replace(/\p{Extended_Pictographic}|[\u{1F3FB}-\u{1F3FF}⃣️‍]/gu, "") // אימוג'ים
    .replace(/\s+/g, " ").trim();
  t = Array.from(t).slice(0, max).join("").trim().replace(/[. ]+$/, "");
  if (!t || /^(con|prn|aux|nul|com\d|lpt\d)$/i.test(t)) t = `${v?.user || "video"}_${v?.id || ""}`.replace(/[^\w.-]+/g, "_");
  return t;
}
function uniqueNames(files) {
  const seen = new Map();
  for (const f of files) {
    const dot = f.name.lastIndexOf(".");
    const base = dot > 0 ? f.name.slice(0, dot) : f.name, ext = dot > 0 ? f.name.slice(dot) : "";
    let name = f.name, k = 1;
    while (seen.has(name.toLowerCase())) name = `${base} (${++k})${ext}`;
    seen.set(name.toLowerCase(), 1);
    f.name = name;
  }
  return files;
}
const MEDIA_RE = /\.(mp4|mov|m4v|webm|mkv|jpe?g|png|webp|gif|mp3|m4a|aac|opus|ogg)$/i;
function looksValid(f) {
  const d = f.data;
  if (!d || d.length < 200) return false;
  if (/\.(mp4|mov|m4v)$/i.test(f.name)) return looksLikeVideo(d);
  for (let i = 0; i < Math.min(d.length, 64); i++) if (d[i] !== 0) return true; // לא קובץ של אפסים
  return false;
}
function looksLikeVideo(data) {
  // קובץ MP4 תקין מכיל "ftyp" בבייטים 4–8
  return data.length > 1000 && String.fromCharCode(...data.subarray(4, 8)) === "ftyp";
}

// מוציא את כל הקבצים מתוך ZIP (כמו זה ש־GitHub מחזיר)
async function readAllFromZip(bytes) {
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 66000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("הקובץ שהתקבל מ־GitHub פגום");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = [];
  for (let n = 0; n < count; n++) {
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true), usize = dv.getUint32(p + 24, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const loff = dv.getUint32(p + 42, true);
    const full = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + elen + clen;
    if (full.endsWith("/")) continue;
    const start = loff + 30 + dv.getUint16(loff + 26, true) + dv.getUint16(loff + 28, true);
    const raw = bytes.subarray(start, start + csize);
    let data;
    if (method === 0) data = raw;
    else if (method === 8) {
      const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      data = new Uint8Array(await new Response(stream).arrayBuffer());
    } else throw new Error("שיטת דחיסה לא נתמכת");
    if (usize && data.length !== usize) throw new Error("קובץ חלקי התקבל מ־GitHub – נסה שוב");
    out.push({ name: full.split("/").pop(), data });
  }
  return out;
}

// מוריד את התוצאה מ־GitHub ושומר ZIP חדש ונקי ש־Windows פותח
async function saveVideosZip(art, zipName, onPct, items = []) {
  const bytes = await fetchArtifact(art, (pct) => pct != null && onPct(pct));
  let files = (await readAllFromZip(bytes)).filter((f) => MEDIA_RE.test(f.name));
  if (!files.length) throw new Error("לא נמצא קובץ להורדה בתוצאה");
  files = files.filter(looksValid);
  if (!files.length) throw new Error("הקובץ שהתקבל אינו תקין – נסה שוב");
  for (const f of files) {
    const ext = (f.name.match(/\.\w+$/) || [".mp4"])[0].toLowerCase();
    const item = items.find((v) => f.name.includes(v.id)) || (items.length === 1 ? items[0] : null);
    if (!item) continue;
    const num = f.name.match(/_(\d{1,3})\.\w+$/);           // תמונה מספר X בפוסט
    const audio = /_audio\.\w+$/.test(f.name);
    f.name = safeName(item) + (num ? ` - ${+num[1]}` : audio ? " - סאונד" : "") + ext;
  }
  saveBlob(buildZip(uniqueNames(files)), zipName);
  return files;
}

// ---------- הורדה מ־Release (כמו בתוסף ההורדות שעובד) ----------
// השרת אורז ZIP רגיל ומפרסם אותו כ־Release בשם dl-<מספר ההרצה>; מורידים אותו כמו שהוא.
const namesFor = (list) => JSON.stringify(Object.fromEntries(list.map((v) => [v.id, Array.from(String(v.title || "")).slice(0, 120).join("")])));
async function fetchRelease(run, onPct) {
  const auth = { Authorization: `Bearer ${cfg.token}` };
  let rel = null, lastStatus = 0;
  for (let i = 0; i < 6 && !rel; i++) {
    const res = await fetch(`${GH}${repoPath()}/releases/tags/dl-${run.id}`, { cache: "no-store", headers: { ...auth, Accept: "application/vnd.github+json" } });
    lastStatus = res.status;
    if (res.ok) { rel = await res.json(); break; }
    if (res.status === 403 || res.status === 401) break;
    await sleep(1500);
  }
  if (!rel) throw Object.assign(new Error(`release ${lastStatus}`), { perm: lastStatus === 403 || lastStatus === 404 });
  const asset = (rel.assets || []).find((a) => /\.zip$/i.test(a.name));
  if (!asset) throw new Error("release without zip");
  const res = await fetch(`${GH}${repoPath()}/releases/assets/${asset.id}`, { cache: "no-store", redirect: "follow", headers: { ...auth, Accept: "application/octet-stream" } });
  if (!res.ok) throw Object.assign(new Error(`asset ${res.status}`), { perm: res.status === 403 || res.status === 404 });
  const total = asset.size || +res.headers.get("content-length") || 0;
  const reader = res.body.getReader(); const chunks = []; let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    if (total) onPct?.(Math.min(100, Math.round((got / total) * 100)));
  }
  const bytes = new Uint8Array(got); let off = 0;
  for (const c of chunks) { bytes.set(c, off); off += c.length; }
  // בדיקה שהקובץ תקין לפני שמירה
  if (!(bytes[0] === 0x50 && bytes[1] === 0x4b)) throw new Error("not a zip");
  const inside = (await readAllFromZip(bytes)).filter((f) => MEDIA_RE.test(f.name));
  if (!inside.length || !inside.some(looksValid)) throw new Error("zip without valid media");
  return { bytes, files: inside.filter(looksValid) };
}
let permHintShown = false;
function permHint(e) {
  if (!e?.perm || permHintShown) return;
  permHintShown = true;
  setTimeout(() => toast("טיפ: הוסף למפתח הגישה ב־GitHub הרשאת Contents: Read-only – ההורדה תהיה ישירה ויציבה יותר", true), 2500);
}
// מוריד: קודם מה־Release (הדרך שעובדת), ואם אין – מהדרך הקודמת
async function saveDownload(run, art, zipName, onPct, items) {
  try {
    const { bytes, files } = await fetchRelease(run, onPct);
    saveBlob(new Blob([bytes], { type: "application/zip" }), zipName);
    return files;
  } catch (e) {
    console.warn("release download failed, using artifact", e);
    permHint(e);
    return saveVideosZip(art, zipName, onPct, items);
  }
}

// ---------- קבלת התוצאה מהענף הזמני (קריא לאתר רגיל) ----------
async function fetchBranchFile(rid, path, onPct) {
  const url = `${GH}${repoPath()}/contents/${path}?ref=${encodeURIComponent("w/" + rid)}`;
  let last = 0;
  for (let i = 0; i < 8; i++) {
    const res = await fetch(url, { cache: "no-store", headers: { Authorization: `Bearer ${cfg.token}`, Accept: "application/vnd.github.raw" } });
    last = res.status;
    if (res.status === 404) { await sleep(1500); continue; }
    if (res.status === 401) throw new Error("מפתח הגישה לא תקין");
    if (res.status === 403) throw new Error("למפתח חסרה הרשאת Contents: Read-only");
    if (!res.ok) throw new Error(`שגיאה ${res.status} בקבלת התוצאה`);
    const total = +res.headers.get("content-length") || 0;
    const reader = res.body.getReader(); const chunks = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      if (total) onPct?.(Math.min(100, Math.round((got / total) * 100)));
    }
    const out = new Uint8Array(got); let off = 0;
    for (const c of chunks) { out.set(c, off); off += c.length; }
    return out;
  }
  throw new Error(`התוצאה לא נמצאה (${last}) – נסה שוב`);
}

// ---------- תאריך מתוך מספר הסרטון ----------
function idDate(id) {
  try {
    const t = Number(BigInt(id) >> 32n);
    return t > 1420070400 && t < Date.now() / 1000 + 86400 ? t : null;
  } catch { return null; }
}
const DAY = 86400;
function ago(t) {
  if (!t) return "";
  const d = Math.floor((Date.now() / 1000 - t) / DAY);
  if (d < 1) return "היום";
  if (d === 1) return "אתמול";
  if (d < 7) return `לפני ${d} ימים`;
  if (d < 30) return `לפני ${Math.floor(d / 7)} שבועות`;
  if (d < 365) return `לפני ${Math.floor(d / 30)} חודשים`;
  return `לפני ${Math.floor(d / 365)} שנים`;
}

const filters = { date: "any", len: "any", sort: "relevance" };
function view() {
  const src = state.mode === "saved" ? state.saved : state.mode === "history" ? state.history : state.items;
  const now = Date.now() / 1000;
  const maxAge = { any: Infinity, day: DAY, week: 7 * DAY, month: 30 * DAY, year: 365 * DAY }[filters.date];
  let list = src.filter((v) => {
    if (maxAge !== Infinity && !(v.date && now - v.date <= maxAge)) return false;
    if (filters.len !== "any") {
      if (!v.duration) return false;
      if (filters.len === "short" && v.duration >= 60) return false;
      if (filters.len === "medium" && (v.duration < 60 || v.duration > 300)) return false;
      if (filters.len === "long" && v.duration <= 300) return false;
    }
    return true;
  });
  const by = {
    views: (a, b) => (b.views || 0) - (a.views || 0),
    newest: (a, b) => (b.date || 0) - (a.date || 0),
    oldest: (a, b) => (a.date || Infinity) - (b.date || Infinity),
    shortest: (a, b) => (a.duration || Infinity) - (b.duration || Infinity),
    longest: (a, b) => (b.duration || 0) - (a.duration || 0)

  if (by) list = [...list].sort(by);

}

// ---------- חיפוש ----------
async function search(q, append = false) {
  q = q.trim();
  if (!q || state.busy) return false;
  if (!cfg.token) { openSettings(); return false; }
  if (!append) state.loadingAll = false;
  state.mode = "results";
  if (!append) state.kind = /^@[\w.\-]+$/.test(q) ? "user" : /^#\S+$/u.test(q) ? "tag" : "search";
  if (!append) {
    saveRecent(q);
    Object.assign(state, { q, cursor: 0, hasMore: false, items: [] });
    state.selected.clear();
    render();
  }
  const token = ++state.token;
  state.busy = true;
  els.more.hidden = true;
  setStatus("");
  startProgress("שולח בקשה ל־GitHub…");
  try {
    const inputs = { mode: state.kind, query: state.q, cursor: String(state.cursor), page_size: String(PAGE_SIZE) };
    if (state.kind === "search" && !isLink(state.q)) inputs.expand = "1";
    const { request_id } = await runJob(inputs, stepProgress);
    const data = JSON.parse(new TextDecoder().decode(await fetchBranchFile(request_id, "result.json")));
    if (token !== state.token) return false;
    if (data.error && !(data.items || []).length && !state.items.length) {
      throw new Error("השרת לא הצליח למצוא תוצאות. נסה מילים אחרות, או שלח צילום של הפרטים: " + data.error.slice(0, 200));
    }
    const fresh = (data.items || [])
      .filter((v) => v && v.id && !state.items.some((x) => x.id === v.id))
      .map((v) => remember({ ...v, date: v.date || idDate(v.id) }));
    state.cursor = data.cursor || state.cursor + PAGE_SIZE;
    state.hasMore = !!data.hasMore && fresh.length > 0;
    state.items.push(...fresh);
    state.busy = false;
    render();
    if (!append && data.expanded?.length) {
      const what = data.expanded.map((x) => (x.type === "user" ? "@" : "#") + x.name).join(", ");
      toast(`➕ הרחבתי את התוצאות לפי: ${what}`);
    }
    if (!state.items.length) setStatus(`<span class="emoji">🔍</span>לא נמצאו סרטונים עבור "${esc(state.q)}"`, true);
    return true;
  } catch (e) {
    if (token !== state.token) return false;
    if (state.items.length) toast(e.message, true);
    else showError(e, () => search(state.q));
  } finally {
    state.busy = false;
    stopProgress();
    els.more.hidden = state.mode !== "results" || !state.hasMore;
    els.moreAll.hidden = els.more.hidden;
  }
  return false;
}

// ---------- טען הכול ----------
async function loadAll() {
  if (state.loadingAll) { state.loadingAll = false; return; }
  state.loadingAll = true;
  els.moreAll.hidden = false;
  els.moreAll.textContent = "⏹ עצור";
  let rounds = 0;
  try {
    while (state.loadingAll && state.hasMore && rounds < LOAD_ALL_MAX) {
      rounds++;
      const ok = await search(state.q, true);
      if (!ok) break;
      els.moreAll.hidden = false;
      els.moreAll.textContent = `⏹ עצור (נטענו ${state.items.length})`;
    }

// ---------- מעקב התקדמות הורדות ----------
// כל סרטון עובר שלבים: שליחה → תור → השרת מוריד → מעביר אליך → מוכן
const prog = new Map(); // id -> { pct, label, phase, t }
const PHASES = {
  start:   { from: 2,  to: 6,  label: "שולח…" },
  queued:  { from: 6,  to: 12, label: "ממתין לשרת" },
  running: { from: 12, to: 70, label: "השרת מוריד" },
  fetch:   { from: 70, to: 72, label: "מעביר אליך" },
  pack:    { from: 98, to: 99, label: "אורז" },
  done:    { from: 100, to: 100, label: "מוכן ✓" },
  fail:    { from: 0, to: 0, label: "נכשל ✗" }
};
function setPhase(id, phase) {
  const p = prog.get(id) || {};
  if (p.phase === phase) return;
  prog.set(id, { phase, t: Date.now(), pct: Math.max(p.pct || 0, PHASES[phase].from), label: PHASES[phase].label });
  paintProgress(id);
}
function setReal(id, pct, label = "מעביר אליך") { // אחוז אמיתי בזמן ההעברה אליך: 72%–98%
  const p = prog.get(id); if (!p) return;
  p.pct = Math.max(p.pct, 72 + Math.round((pct / 100) * 26)); p.label = label; p.phase = "transfer";
  paintProgress(id);
}
// הערכה לפי זמן בשלבים שבהם GitHub לא מדווח אחוזים
setInterval(() => {
  for (const [id, p] of prog) {
    const ph = PHASES[p.phase];
    if (!ph || ph.from === ph.to) continue;
    const secs = (Date.now() - p.t) / 1000;
    const expect = p.phase === "running" ? 35 : 12; // כמה שניות השלב לוקח בערך
    const est = ph.from + (ph.to - ph.from) * (1 - Math.exp(-secs / expect));
    if (est > p.pct) { p.pct = Math.round(est); paintProgress(id); }
  }
  paintOverall();
}, 400);

function progressHtml(id) {
  const p = prog.get(id);
  if (!p) return "";
  const cls = p.phase === "fail" ? " fail" : p.phase === "done" ? " ok" : "";
  return `<div class="pbar${cls}"><i style="width:${p.pct}%"></i><span>${esc(p.label)}${p.phase === "fail" ? "" : ` · ${p.pct}%`}</span></div>`;
}
function paintProgress(id) {
  const card = els.grid.querySelector(`.card[data-id="${CSS.escape(id)}"] .thumb`);
  if (!card) return;
  const old = card.querySelector(".pbar");
  const html = progressHtml(id);
  if (old) old.outerHTML = html || ""; else if (html) card.insertAdjacentHTML("beforeend", html);
}
function clearProgress(ids, delay = 2500) {
  setTimeout(() => { ids.forEach((id) => { prog.delete(id); paintProgress(id); }); }, delay);
}

// אחוז כללי בהורדה של כמה סרטונים
let batch = null; // { ids: [], label }
function paintOverall() {
  if (!batch) { els.selProg.hidden = true; return; }
  const vals = batch.ids.map((id) => prog.get(id)?.pct ?? 0);
  let pct = Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
  if (batch.packing) pct = Math.max(pct, 99);
  const done = batch.ids.filter((id) => ["done", "fail", "pack"].includes(prog.get(id)?.phase)).length;
  els.selProg.hidden = false;
  els.selBar.hidden = false;
  els.selCount.textContent = `מוריד ${batch.ids.length}`;
  els.selProgBar.style.width = pct + "%";
  els.selProgText.textContent = batch.packing ? `אורז ${batch.ids.length} סרטונים לקובץ אחד… ${pct}%` : `${pct}% · ${done} מתוך ${batch.ids.length} מוכנים`;
  els.selDl.textContent = `⏳ ${pct}%`;
}

// ---------- מטמון: סרטון שהוכן (לצפייה או להורדה) נשמר בזיכרון ----------
const cache = new Map();    // id -> { zip: Uint8Array|null, files: [{name,data}], size, urls: [] }
const inflight = new Map(); // id -> Promise
const CACHE_MAX = 700 * 1024 * 1024;
function putCache(id, entry) {
  entry.size = (entry.zip?.length || 0) + entry.files.reduce((n, f) => n + f.data.length, 0);
  entry.urls = [];
  cache.set(id, entry);
  let total = [...cache.values()].reduce((n, e) => n + e.size, 0);
  for (const [k, e] of cache) {           // מוציאים את הישנים אם הזיכרון מתמלא
    if (total <= CACHE_MAX || k === id) continue;
    e.urls.forEach((u) => URL.revokeObjectURL(u));
    cache.delete(k); total -= e.size;
  }
  paintCard(id);
}
function titledFiles(v, files) {
  return uniqueNames(files.map((f) => {
    const ext = (f.name.match(/\.\w+$/) || [".mp4"])[0].toLowerCase();
    const num = f.name.match(/_(\d{1,3})\.\w+$/);
    const audio = /_audio\.\w+$/.test(f.name);
    return { name: safeName(v) + (num ? ` - ${+num[1]}` : audio ? " - סאונד" : "") + ext, data: f.data };
  }));
}
// מכין סרטון: השרת מוריד, ואנחנו מקבלים את הקבצים (מה־Release, ובגיבוי מה־Artifact)
function prepare(v, onPhase, onPct) {

  if (inflight.has(v.id)) return inflight.get(v.id);
  const p = (async () => {
    const { request_id } = await runJob({ mode: "download", url: v.link, names: namesFor([v]) }, (_, ph) => ph && onPhase?.(ph));
    onPhase?.("fetch");
    const bytes = await fetchBranchFile(request_id, "download.zip", onPct);
    const files = (await readAllFromZip(bytes)).filter((f) => MEDIA_RE.test(f.name) && looksValid(f));
    if (!files.length) throw new Error("הקובץ שהתקבל אינו תקין – נסה שוב");
    const entry = { zip: bytes, files };
    putCache(v.id, entry);
    return entry;
  })().finally(() => inflight.delete(v.id));
  inflight.set(v.id, p);
  return p;
}
function saveEntry(v, entry) {
  const name = `${safeName(v, 60)}.zip`;
  if (entry.zip) saveBlob(new Blob([entry.zip], { type: "application/zip" }), name);
  else saveBlob(buildZip(entry.files.map((f) => ({ ...f }))), name);
}
function paintCard(id) {
  const card = els.grid.querySelector(`.card[data-id="${CSS.escape(id)}"] .thumb`);
  if (!card) return;
  card.classList.toggle("ready", cache.has(id));
}

// ---------- הורדה של סרטון אחד ----------
const downloading = new Set();
async function download(v, btn) {
  if (downloading.has(v.id)) return;
  if (!cfg.token) { openSettings(); return; }
  if (cache.has(v.id)) {                 // כבר הוכן (למשל אחרי צפייה) – שומרים מיד
    saveEntry(v, cache.get(v.id));
    afterDownload([v]);
    toast("✓ הקובץ ירד כ־ZIP");
    return;
  }
  downloading.add(v.id);
  const orig = btn ? btn.innerHTML : "";
  if (btn) btn.disabled = true;
  setPhase(v.id, "start");
  const tick = setInterval(() => { const p = prog.get(v.id); if (p && btn) btn.textContent = `⏳ ${p.pct}%`; }, 300);
  try {
    const entry = await prepare(v, (ph) => setPhase(v.id, ph), (pct) => setReal(v.id, pct));
    saveEntry(v, entry);
    setPhase(v.id, "done");
    afterDownload([v]);
    toast("✓ הקובץ ירד כ־ZIP");
  } catch (e) {
    setPhase(v.id, "fail");
    showDlError(e);
    notify("ההורדה נכשלה", safeName(v));
  } finally {
    clearInterval(tick);
    if (btn) { btn.disabled = false; btn.innerHTML = orig; }
    downloading.delete(v.id);
    clearProgress([v.id], 3000);
  }
}

function saveBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

// ---------- הורדת כמה סרטונים כ־ZIP אחד ----------
// מהיר: שרת אחד מוריד את כל הנבחרים יחד (4 במקביל) ומחזיר ZIP אחד
async function downloadMany(list) {
  if (!list.length || state.multiBusy) return;
  if (!cfg.token) { openSettings(); return; }
  if (list.length > 15) { toast("אפשר להוריד עד 15 סרטונים בבת אחת", true); return; }
  state.multiBusy = true;
  els.selDl.disabled = true;
  batch = { ids: list.map((v) => v.id), packing: false };
  list.forEach((v) => setPhase(v.id, "start"));
  paintOverall();
  let ok = false;
  try {
    const { request_id } = await runJob({ mode: "download", url: list.map((v) => v.link).join(" "), names: namesFor(list) },
      (_, ph) => ph && list.forEach((v) => setPhase(v.id, ph)));
    list.forEach((v) => setPhase(v.id, "fetch"));
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
    const name = `videos_${list.length}_${stamp}.zip`;
    const zipBytes = await fetchBranchFile(request_id, "download.zip", (pct) => list.forEach((v) => setReal(v.id, pct)));
    const got = (await readAllFromZip(zipBytes)).filter((f) => MEDIA_RE.test(f.name) && looksValid(f));
    if (!got.length) throw new Error("הקובץ שהתקבל אינו תקין – נסה שוב");
    saveBlob(new Blob([zipBytes], { type: "application/zip" }), name);
    list.forEach((v) => setPhase(v.id, "done"));
    afterDownload(list);
    const gotItems = list.filter((v) => got.some((f) => f.name.startsWith(safeName(v)))).length || got.length;
    toast(gotItems < list.length ? `ירדו ${gotItems} מתוך ${list.length} (חלק לא היו זמינים)` : `✓ ירדו ${gotItems} פריטים בקובץ ZIP אחד`, gotItems < list.length);
    state.selected.clear();
    ok = true;
  } catch (e) {
    console.warn("fast batch failed, falling back", e);
    state.lastErr = e;
  } finally {
    const ids = batch.ids;
    batch = null;
    state.multiBusy = false;
    els.selDl.disabled = false;
    els.selDl.textContent = "⬇ הורד נבחרים כ־ZIP אחד";
    paintOverall();
    if (ok) { render(); clearProgress(ids, 4000); }
  }
  // גיבוי: הדרך הקודמת – שרת נפרד לכל סרטון
  if (!ok) { toast("מנסה בדרך חלופית…"); return downloadManyEach(list); }
}

async function downloadManyEach(list) {
  if (!list.length || state.multiBusy) return;
  if (!cfg.token) { openSettings(); return; }
  if (list.length > 15) { toast("אפשר להוריד עד 15 סרטונים בבת אחת", true); return; }
  state.multiBusy = true;
  els.selDl.disabled = true;
  batch = { ids: list.map((v) => v.id), packing: false };
  list.forEach((v) => setPhase(v.id, "start"));
  paintOverall();
  const files = [], failed = [];
  const queue = [...list];
  async function worker() {
    while (queue.length) {
      const v = queue.shift();
      try {
        const entry = await prepare(v, (ph) => setPhase(v.id, ph), (pct) => setReal(v.id, pct));
        for (const f of entry.files) files.push({ name: f.name, data: f.data, id: v.id });
        setPhase(v.id, "pack");
      } catch (e) {
        failed.push(v);
        state.lastErr = state.lastErr || e;
        setPhase(v.id, "fail");
      }
      paintOverall();
    }
  }
  try {
    await Promise.all(Array.from({ length: Math.min(4, list.length) }, worker));
    if (!files.length) {
      const le = state.lastErr;
      const err = new Error("ההורדה נכשלה" + (le?.message ? `: ${le.message}` : ""));
      err.url = le?.url;
      throw err;
    }
    batch.packing = true; paintOverall();
    await sleep(50);
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
    saveBlob(buildZip(uniqueNames(files)), `videos_${files.length}_${stamp}.zip`);
    files.forEach((f) => setPhase(f.id, "done"));
    afterDownload(list.filter((v) => files.some((f) => f.id === v.id)));
    toast(failed.length ? `ירדו ${files.length}, נכשלו ${failed.length}` : `✓ ירדו ${files.length} סרטונים בקובץ ZIP אחד`, !!failed.length);
    state.selected.clear();
  } catch (e) {
    showDlError(e);
    notify("ההורדה נכשלה", e.message);
  } finally {
    state.lastErr = null;
    const ids = batch.ids;
    batch = null;
    state.multiBusy = false;
    els.selDl.disabled = false;
    els.selDl.textContent = "⬇ הורד נבחרים כ־ZIP אחד";
    paintOverall();
    render();
    clearProgress(ids, 4000);
  }
}

function showDlError(e) {
  setStatus(`<span class="emoji">⚠️</span>${esc(e.message)}
    ${e.url ? `<br><a href="${esc(e.url)}" target="_blank">לפרטי השגיאה ב־GitHub</a>` : ""}
    <br><button class="secondary" id="dismissErr">סגור</button>`, false);
  const b = $("dismissErr"); if (b) b.onclick = () => setStatus("");
  toast(e.message, true);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ---------- מועדפים וסימון הורדות ----------
async function toggleSaved(v) {
  if (state.savedIds.has(v.id)) {
    state.saved = state.saved.filter((x) => x.id !== v.id);
    state.savedIds.delete(v.id);
    toast("הוסר מהשמורים");
  } else {
    state.saved.unshift({ ...v });
    state.savedIds.add(v.id);
    toast("★ נשמר");
  }
  await storage.set({ saved: state.saved.slice(0, 300) });
  render();
}
// אחרי הורדה מוצלחת: סימון ✓, היסטוריה, התראה
async function afterDownload(list) {
  if (!list.length) return;
  await markDone(list.map((v) => v.id));
  const now = Date.now();
  const entries = list.map((v) => ({
    id: v.id, title: v.title, user: v.user, nick: v.nick, link: v.link, kind: v.kind, count: v.count,
    site: v.site, duration: v.duration, views: v.views, date: v.date,
    cover: v.cover && v.cover.length < 80000 ? v.cover : "", dlAt: now
  }));
  const ids = new Set(entries.map((e) => e.id));
  state.history = [...entries, ...state.history.filter((h) => !ids.has(h.id))].slice(0, 300);
  entries.forEach(remember);
  await storage.set({ history: state.history });
  notify(list.length > 1 ? `✓ ירדו ${list.length} פריטים` : "✓ ההורדה הסתיימה", list.length > 1 ? "הקובץ נשמר בתיקיית ההורדות" : safeName(list[0]));
  if (state.mode === "history") render();
}
function notify() { /* באתר אין התראות מערכת */ }

async function markDone(ids) {
  ids.forEach((id) => state.doneIds.add(id));
  await storage.set({ done: [...state.doneIds].slice(-2000) });

}

    const t = document.createElement("textarea");

}

}

};

// ---------- נגן (דרך הפרוקסי) ----------
let playerList = [], pIndex = -1, pToken = 0, pTick = null;
const TYPES = { mp4: "video/mp4", m4v: "video/mp4", mov: "video/quicktime", webm: "video/webm", mkv: "video/x-matroska",
  jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", webp: "image/webp", gif: "image/gif",
  mp3: "audio/mpeg", m4a: "audio/mp4", aac: "audio/aac", opus: "audio/ogg", ogg: "audio/ogg" };
const extOf = (n) => (n.match(/\.(\w+)$/) || [, ""])[1].toLowerCase();
function blobUrl(entry, f) {
  const u = URL.createObjectURL(new Blob([f.data], { type: TYPES[extOf(f.name)] || "application/octet-stream" }));
  entry.urls.push(u);
  return u;
}

function openPlayer(v) {
  playerList = view();
  pIndex = playerList.findIndex((x) => x.id === v.id);
  showInPlayer(v);
}
function closePlayer() {
  if (els.player.hidden) return;
  els.player.hidden = true;
  els.pStage.innerHTML = "";
  clearInterval(pTick);
  state.playing = null;
  pToken++;
}
function stepPlayer(d) {
  const i = pIndex + d;
  if (i < 0 || i >= playerList.length) return;
  pIndex = i;
  showInPlayer(playerList[i]);
}

async function showInPlayer(v) {
  const token = ++pToken;
  state.playing = v.id;
  els.player.hidden = false;
  clearInterval(pTick);
  els.pAuthor.hidden = !v.user;
  els.pAuthor.textContent = v.user ? `@${v.user}${v.nick && v.nick !== v.user ? " · " + v.nick : ""}` : "";
  els.pAuthor.disabled = !!(v.site && v.site !== "tiktok");
  els.pTitle.innerHTML = titleHtml(v.title) || "<span style='color:var(--muted)'>ללא כותרת</span>";
  els.pStats.innerHTML = [
    v.views != null && `▶ ${fmt(v.views)} צפיות`,
    v.duration && `⏱ ${dur(v.duration)}`,
    v.date && `📅 ${ago(v.date)}`,
    v.kind === "photo" && `🖼 פוסט תמונות`
  ].filter(Boolean).map((x) => `<span>${x}</span>`).join("");
  els.pLink.value = v.link;
  els.pPrev.style.visibility = pIndex > 0 ? "visible" : "hidden";
  els.pNext.style.visibility = pIndex >= 0 && pIndex < playerList.length - 1 ? "visible" : "hidden";

  if (cache.has(v.id)) { showMedia(v, cache.get(v.id)); return; }

  els.pStage.innerHTML = `
    <div class="pwait">
      ${v.cover ? `<img class="pwcover" src="${esc(v.cover)}" alt="">` : ""}
      <div class="pwbox">
        <span class="spinner"></span>
        <div class="pwtext" id="pwText">השרת מכין את ${v.kind === "photo" ? "התמונות" : "הסרטון"}…</div>
        <div class="pwbar"><i id="pwBar"></i></div>
        <div class="pwhint">זה לוקח בערך 20–30 שניות.<br>אפשר לסגור את החלון – ההכנה תמשיך ברקע.</div>
      </div>
    </div>`;
  setPhase(v.id, "start");
  pTick = setInterval(() => {
    const p = prog.get(v.id), t = $("pwText"), bar = $("pwBar");
    if (!p || !t || token !== pToken) return;
    t.textContent = `${p.label} · ${p.pct}%`;
    bar.style.width = p.pct + "%";
  }, 300);
  try {
    const entry = await prepare(v, (ph) => setPhase(v.id, ph), (pct) => setReal(v.id, pct));
    setPhase(v.id, "done"); clearProgress([v.id], 1200);
    if (token !== pToken) { toast(`▶ מוכן לצפייה: ${safeName(v, 40)}`); return; }
    clearInterval(pTick);
    showMedia(v, entry);
  } catch (e) {
    setPhase(v.id, "fail"); clearProgress([v.id], 3000);
    if (token !== pToken) return;
    clearInterval(pTick);
    els.pStage.innerHTML = `<div class="pwait"><div class="pwbox"><div class="emoji">⚠️</div>
      <div class="pwtext">${esc(e.message)}</div>
      ${e.url ? `<a href="${esc(e.url)}" target="_blank">לפרטי השגיאה ב־GitHub</a>` : ""}
      <button class="primary" id="pRetry">נסה שוב</button></div></div>`;
    $("pRetry").onclick = () => showInPlayer(v);
  }
}

function showMedia(v, entry) {
  const vids = entry.files.filter((f) => TYPES[extOf(f.name)]?.startsWith("video"));
  const imgs = entry.files.filter((f) => TYPES[extOf(f.name)]?.startsWith("image"));
  const auds = entry.files.filter((f) => TYPES[extOf(f.name)]?.startsWith("audio"));
  if (vids.length) {
    els.pStage.innerHTML = `<video controls autoplay playsinline src="${blobUrl(entry, vids[0])}"></video>`;
    const vid = els.pStage.querySelector("video");
    vid.onerror = () => { els.pStage.innerHTML = `<div class="pwait"><div class="pwbox"><div class="emoji">⚠️</div><div class="pwtext">הדפדפן לא מצליח לנגן את הקובץ הזה. אפשר להוריד אותו ולפתוח בנגן במחשב.</div></div></div>`; };
    return;
  }
  if (imgs.length) {
    const urls = imgs.map((f) => blobUrl(entry, f));
    let i = 0;
    els.pStage.innerHTML = `
      <div class="gallery">
        <img id="gImg" src="${urls[0]}" alt="">
        ${urls.length > 1 ? `<button class="gnav gprev" id="gPrev">‹</button><button class="gnav gnext" id="gNext">›</button>` : ""}
        <span class="gcount" id="gCount">1 / ${urls.length}</span>
        ${auds.length ? `<audio controls autoplay loop src="${blobUrl(entry, auds[0])}"></audio>` : ""}
      </div>`;
    const show = (d) => { i = (i + d + urls.length) % urls.length; $("gImg").src = urls[i]; $("gCount").textContent = `${i + 1} / ${urls.length}`; };
    if (urls.length > 1) { $("gPrev").onclick = () => show(-1); $("gNext").onclick = () => show(1); }
    return;
  }
  if (auds.length) {
    els.pStage.innerHTML = `<div class="pwait"><div class="pwbox"><div class="emoji">🎵</div><audio controls autoplay src="${blobUrl(entry, auds[0])}"></audio></div></div>`;
    return;
  }
  els.pStage.innerHTML = `<div class="pwait"><div class="pwbox"><div class="pwtext">אין מה להציג</div></div></div>`;
}

els.player.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) closePlayer(); });
els.pPrev.onclick = () => stepPlayer(-1);
els.pNext.onclick = () => stepPlayer(1);
els.pCopy.onclick = () => copy(els.pLink.value);
els.pDl.onclick = () => { const v = byId.get(state.playing); if (v) download(v, els.pDl); };
els.pAuthor.onclick = () => { const v = byId.get(state.playing); if (v?.user) goUser(v.user); };
els.pTitle.addEventListener("click", (e) => { const t = e.target.closest("[data-act='tag']"); if (t) goTag(t.dataset.tag); });

// ---------- היסטוריה ----------
els.historyBtn.onclick = () => {
  state.mode = state.mode === "history" ? "results" : "history";
  state.selected.clear();
  if (state.mode === "results" && !state.items.length) setStatus(`<span class="emoji">🎬</span>הקלד מילת חיפוש או הדבק קישור לסרטון`, true);
  render();
};
let clearArmed = false;
els.clearHistory.onclick = async () => {
  if (!clearArmed) {
    clearArmed = true; els.clearHistory.textContent = "⚠ לחץ שוב לאישור";
    setTimeout(() => { clearArmed = false; els.clearHistory.textContent = "🧹 נקה היסטוריה"; }, 3000);
    return;
  }
  clearArmed = false; els.clearHistory.textContent = "🧹 נקה היסטוריה";
  state.history = []; await storage.set({ history: [] });
  toast("ההיסטוריה נוקתה"); render();
};

// סרגל סינון
els.toolbar.addEventListener("change", (e) => {
  const f = e.target.dataset.f;
  if (f) { filters[f] = e.target.value; storage.set({ filters }); render(); }
});
$("copyAll").onclick = () => {
  const list = view();
  if (list.length) copy(list.map((v) => v.link).join("\n"), `✓ הועתקו ${list.length} קישורים`);
};
$("selectAll").onclick = () => {
  const list = view();
  const all = list.every((v) => state.selected.has(v.id));
  list.forEach((v) => (all ? state.selected.delete(v.id) : state.selected.add(v.id)));
  render();
};
els.savedBtn.onclick = () => {
  state.mode = state.mode === "saved" ? "results" : "saved";
  state.selected.clear();
  if (state.mode === "results" && !state.items.length) setStatus(`<span class="emoji">🎬</span>הקלד מילת חיפוש או הדבק קישור לסרטון`, true);
  render();
};

// סרגל בחירה
const selectedItems = () => [...state.selected].map((id) => byId.get(id)).filter(Boolean);
$("selCopy").onclick = () => { const l = selectedItems(); copy(l.map((v) => v.link).join("\n"), `✓ הועתקו ${l.length} קישורים`); };
els.selDl.onclick = () => downloadMany(selectedItems());
$("selClear").onclick = () => { state.selected.clear(); render(); };

els.recent.addEventListener("click", (e) => {
  const c = e.target.closest(".chip");
  if (c) { els.q.value = c.dataset.q; els.clear.hidden = false; search(c.dataset.q); }
});
document.addEventListener("keydown", (e) => {
  if (!els.player.hidden) {
    if (e.key === "Escape") closePlayer();
    if (e.target.tagName !== "INPUT") {
      if (e.key === "ArrowLeft") { e.preventDefault(); stepPlayer(1); }   // מימין לשמאל: שמאלה = הבא
      if (e.key === "ArrowRight") { e.preventDefault(); stepPlayer(-1); }
    }
    return;
  }
  if (e.key === "Escape") { els.settings.hidden = true; if (state.selected.size) { state.selected.clear(); render(); } }
  if (e.key === "/" && document.activeElement !== els.q && els.settings.hidden) { e.preventDefault(); els.q.focus(); }
});

// ---------- התחלה ----------
(async () => {
  try {
    const mm = location.hash.match(/setup=([^&]+)/);
    if (mm) {
      const b64 = decodeURIComponent(mm[1]).replace(/-/g, "+").replace(/_/g, "/");
      const c = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0))));
      if (c.token && c.owner && c.repo) {
        await storage.set({ cfg: { owner: c.owner, repo: c.repo, token: c.token } });
        setTimeout(() => toast("✓ האתר הופעל ונשמר במכשיר הזה"), 600);
      }
      window.history.replaceState(null, "", location.pathname + location.search);
    }
  } catch (e) { console.warn("setup link", e); }
  const s = await storage.get({ recent: [], cfg: null, saved: [], done: [], filters: null, history: [], prefs: { notify: false } });
  state.history = s.history || []; state.history.forEach(remember);
  state.prefs = { notify: false, ...(s.prefs || {}) };
  els.sNotify.checked = !!state.prefs.notify;
  renderRecent(s.recent);
  state.saved = s.saved; state.savedIds = new Set(s.saved.map((v) => v.id));
  state.saved.forEach(remember);
  state.doneIds = new Set(s.done);
  if (s.filters) Object.assign(filters, s.filters);
  for (const [k, v] of Object.entries(filters)) { const el = els.toolbar.querySelector(`[data-f="${k}"]`); if (el) el.value = v; }

  const preset = window.PRESET || {};
  if (preset.token && (!s.cfg?.token || s.cfg.presetToken !== preset.token)) {
    s.cfg = { owner: preset.owner, repo: preset.repo, token: preset.token, presetToken: preset.token };
    await storage.set({ cfg: s.cfg });
  }
  render();
  if (s.cfg?.token) {
    cfg = { ...s.cfg, branch: "" };
    setStatus(`<span class="emoji">🎬</span>הקלד מילת חיפוש או הדבק קישור לסרטון`, true);
    els.q.focus();
  } else {
    setStatus(`<span class="emoji">🔗</span>כדי להתחיל צריך להדביק פעם אחת את מפתח הגישה<br><button class="primary" id="goSet">להדבקת המפתח</button>`, true);
    $("goSet").onclick = openSettings;
    openSettings();
  }
})();

  </script>
</body>
</html>
